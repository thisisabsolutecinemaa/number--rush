services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: numberrush
      POSTGRES_PASSWORD: numberrush
      POSTGRES_DB: numberrush
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numberrush"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - api
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
volumes:
  pgdata:

databases:
  - name: number-rush-db
    databaseName: numberrush
    user: numberrush
    plan: free
    region: frankfurt

services:
  - type: web
    name: number-rush-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://number-rush-rrhx.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: number-rush-db
          property: connectionString
